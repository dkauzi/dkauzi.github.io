<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apartment 3D — Warm Minimal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#EFE8DD;font-family:Inter,system-ui,sans-serif;color:#2A2520;overflow:hidden}
#c{display:block;width:100vw;height:100vh;touch-action:none}
.bar{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;pointer-events:none}
.bar button{pointer-events:auto;font:500 14px Inter,system-ui,sans-serif;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #CDBFAA;background:#FBF8F3;color:#2A2520;cursor:pointer}
.bar button[aria-pressed="true"]{background:#2A2520;color:#FBF8F3;border-color:#2A2520}
.head{position:absolute;left:20px;top:16px;pointer-events:none}
.head h1{margin:0;font-size:18px;font-weight:600}
.head p{margin:4px 0 0;font-size:13px;color:#5E554C}
.labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:600;background:rgba(251,248,243,.9);border:1px solid #DDD1BF;padding:3px 8px;border-radius:10px;white-space:nowrap}
body.eve .head h1{color:#F3EEE6}body.eve .head p{color:#CFC6BA}body.eve .bar button[aria-pressed="true"]{background:#E0B44F;color:#2A2520;border-color:#E0B44F}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D model of the apartment"></canvas>
<div class="head"><h1>Your 1-bedroom, warm minimal</h1><p>Drag to orbit · pinch or scroll to zoom</p></div>
<div class="labels" id="labels"></div>
<div class="bar">
  <button id="bOpt" aria-pressed="false">Improved layout</button>
  <button id="bWalls" aria-pressed="false">Full-height walls</button>
  <button id="bTop" aria-pressed="false">Top view</button>
  <button id="bEve" aria-pressed="false">Evening light</button>
  <button id="bLab" aria-pressed="true">Labels</button>
</div>
<div id="err">The 3D viewer couldn't start in this browser.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('err').style.display='flex';return;}
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.82;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#EFE8DD');
const camera=new THREE.PerspectiveCamera(40,1,0.1,200);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.49;controls.minDistance=3;controls.maxDistance=30;
const TARGET=new THREE.Vector3(5,0,3.3);
function view3d(){camera.position.set(5,12,12);controls.target.copy(TARGET);controls.update();}
function viewTop(){camera.position.set(5,15,3.31);controls.target.copy(TARGET);controls.update();}
view3d();

function tex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;}
function rnd(a,b){return a+Math.random()*(b-a);}
const oakTex=tex(512,512,(g,w,h)=>{const n=8,pw=w/n;for(let i=0;i<n;i++){let y=-rnd(0,200);while(y<h){const L=rnd(160,300);const l=rnd(-6,6);g.fillStyle=`hsl(30,${38+l}%,${66+l}%)`;g.fillRect(i*pw,y,pw,L);g.strokeStyle='rgba(120,85,50,.12)';for(let k=0;k<6;k++){g.beginPath();const x=i*pw+rnd(4,pw-4);g.moveTo(x,y);g.bezierCurveTo(x+rnd(-4,4),y+L/3,x+rnd(-4,4),y+2*L/3,x,y+L);g.stroke();}g.fillStyle='rgba(90,60,35,.35)';g.fillRect(i*pw,y,pw,2);y+=L;}g.fillStyle='rgba(90,60,35,.3)';g.fillRect(i*pw,0,1.5,h);}},4,4);
const stoneTex=tex(256,256,(g,w,h)=>{for(let i=0;i<4;i++)for(let j=0;j<4;j++){const l=rnd(-3,3);g.fillStyle=`hsl(36,20%,${84+l}%)`;g.fillRect(i*64,j*64,64,64);}g.strokeStyle='#CFC4B4';g.lineWidth=2;for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,h);g.stroke();g.beginPath();g.moveTo(0,i*64);g.lineTo(w,i*64);g.stroke();}},4,1);
const rugTex=(base)=>tex(256,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<5000;i++){g.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'120,95,70'},${rnd(.03,.12)})`;g.fillRect(rnd(0,w),rnd(0,h),2,2);}},3,3);
const zelTex=tex(256,256,(g,w,h)=>{const s=32;for(let i=0;i<8;i++)for(let j=0;j<8;j++){g.fillStyle=`hsl(${rnd(14,20)},${rnd(48,58)}%,${rnd(40,50)}%)`;g.fillRect(i*s+1,j*s+1,s-2,s-2);}},2,2);
const fluteTex=tex(128,16,(g,w,h)=>{for(let i=0;i<8;i++){const x=i*16;const gr=g.createLinearGradient(x,0,x+16,0);gr.addColorStop(0,'#9C744C');gr.addColorStop(.5,'#C9A174');gr.addColorStop(1,'#9C744C');g.fillStyle=gr;g.fillRect(x,0,16,h);}},6,1);
const slatTex=tex(128,16,(g,w,h)=>{g.fillStyle='#6E5238';g.fillRect(0,0,w,h);for(let i=0;i<8;i++){g.fillStyle='#BB8D5F';g.fillRect(i*16+2,0,11,h);}},3,1);
const boucleTex=tex(128,128,(g,w,h)=>{g.fillStyle='#F2ECE2';g.fillRect(0,0,w,h);for(let i=0;i<1400;i++){g.fillStyle=`rgba(190,175,150,${rnd(.15,.35)})`;g.beginPath();g.arc(rnd(0,w),rnd(0,h),rnd(.8,1.8),0,6.3);g.fill();}},2,2);
const limeTex=tex(256,256,(g,w,h)=>{g.fillStyle='#C9A48A';g.fillRect(0,0,w,h);for(let i=0;i<60;i++){const gr=g.createRadialGradient(rnd(0,w),rnd(0,h),0,0,0,0);g.fillStyle=`rgba(${Math.random()<.5?'235,215,195':'170,125,100'},${rnd(.05,.15)})`;g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(20,70),rnd(10,40),rnd(0,3),0,6.3);g.fill();}},1,1);

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8,metalness:0},o||{}));
const mat={
  wall:M('#EFE7DB',{roughness:.95}),wallTop:M('#3A342E'),oak:M('#C2945F',{roughness:.6}),oakDark:M('#8E6A47',{roughness:.6}),
  floor:new THREE.MeshStandardMaterial({map:oakTex,roughness:.55}),stone:new THREE.MeshStandardMaterial({map:stoneTex,roughness:.9}),
  trav:M('#E6DAC6',{roughness:.5}),worktop:M('#E9E2D6',{roughness:.35}),terr:M('#B05A36'),zel:new THREE.MeshStandardMaterial({map:zelTex,roughness:.25}),
  boucle:new THREE.MeshStandardMaterial({map:boucleTex,color:'#EDE3D3',roughness:1}),linen:M('#F1EBE1',{roughness:1}),olive:M('#6E7744',{roughness:1}),
  rugSand:new THREE.MeshStandardMaterial({map:rugTex('#DDCDB4'),roughness:1}),rugCream:new THREE.MeshStandardMaterial({map:rugTex('#E9E0D0'),roughness:1}),
  black:M('#1C1A18',{roughness:.4}),bronze:M('#3A332C',{roughness:.5,metalness:.4}),brass:M('#B8955B',{roughness:.35,metalness:.8}),
  white:M('#FAF8F4',{roughness:.3}),glass:new THREE.MeshPhysicalMaterial({color:'#D9E6E8',transparent:true,opacity:.22,roughness:.05,metalness:0}),
  leaf:M('#6F7B4A',{roughness:.9}),leaf2:M('#8C9764',{roughness:.9}),teak:M('#9A6A40',{roughness:.7}),cushion:M('#E8DFD0',{roughness:1}),
  flute:new THREE.MeshStandardMaterial({map:fluteTex,roughness:.6}),slat:new THREE.MeshStandardMaterial({map:slatTex,roughness:.6}),
  lime:new THREE.MeshStandardMaterial({map:limeTex,roughness:1}),rattan:M('#C99A5B',{roughness:.9,emissive:'#6b4a1c',emissiveIntensity:0}),
  curtain:M('#EFE6D6',{roughness:1,transparent:true,opacity:.92})
};

const furn=new THREE.Group(), walls=new THREE.Group();scene.add(furn);scene.add(walls);
const furnO=new THREE.Group(),furnP=new THREE.Group(),wallsO=new THREE.Group(),wallsP=new THREE.Group();
furn.add(furnO,furnP);walls.add(wallsO,wallsP);furnP.visible=false;wallsP.visible=false;
function mark(){return [furn.children.length,walls.children.length];}
function moveSince(m,f,w){furn.children.slice(m[0]).forEach(o=>f.add(o));walls.children.slice(m[1]).forEach(o=>w.add(o));}
function box(w,h,d,x,y,z,m,g,noShadow){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y+h/2,z);if(!noShadow){b.castShadow=true;}b.receiveShadow=true;(g||furn).add(b);return b;}
function bx(x0,x1,z0,z1,y0,y1,m,g){return box(x1-x0,y1-y0,z1-z0,(x0+x1)/2,y0,(z0+z1)/2,m,g);}
function cyl(r,h,x,y,z,m,g,seg,rt){const c=new THREE.Mesh(new THREE.CylinderGeometry(rt==null?r:rt,r,h,seg||32),m);c.position.set(x,y+h/2,z);c.castShadow=true;c.receiveShadow=true;(g||furn).add(c);return c;}
function sph(r,x,y,z,m,sx,sy,sz,g){const s=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),m);s.position.set(x,y,z);s.scale.set(sx||1,sy||1,sz||1);s.castShadow=true;(g||furn).add(s);return s;}

// floors
const fl=bx(0,10,0.9,6.6,-0.05,0,mat.floor);fl.castShadow=false;
const bal=bx(0,10,0,0.9,-0.08,-0.02,mat.stone);bal.castShadow=false;
box(10.6,0.1,7.2,5,-0.18,3.3,M('#DCD2C3'),null,true);

// walls (height 1 = scaled later)
const WH=2.6,T=0.15;
function wall(x0,x1,z0,z1,m){return bx(x0,x1,z0,z1,0,WH,m||mat.wall,walls);}
// outer
wall(-T,0,0.9,6.6+T);wall(10,10+T,0.9,6.6+T);
wall(-T,4.45,6.6,6.6+T);wall(5.05,10+T,6.6,6.6+T);
// partition living | bedroom
wall(5.55,5.75,0.9,4.6);
// kitchen end stub by entry
wall(4.3,4.42,5.45,6.6);
// bathroom block top wall, with doors to bedroom (bedroom door) and storage
wall(6.55,8.45,4.5,4.6);wall(9.05,10,4.5,4.6);
// bathroom block dividers
wall(6.5,6.6,4.5,5.1);wall(6.5,6.6,6.0,6.6);
wall(8.25,8.35,4.6,6.6);
wall(9.1,9.2,4.6,5.35);wall(9.1,9.2,6.1,6.6);
// limewash bed wall (inner face of right wall in bedroom)
bx(9.97,10,0.9,4.5,0,WH,mat.lime,walls);
// terracotta backsplash
bx(0.01,0.04,4.45,6.58,0.92,1.55,mat.zel,walls);bx(0.75,3.5,6.56,6.59,0.92,1.55,mat.zel,walls);
// shower zellige walls
bx(6.62,6.65,4.62,5.6,0,WH,mat.zel,walls);bx(6.62,7.75,4.62,4.65,0,WH,mat.zel,walls);
// front glazing + mullions
function glazing(x0,x1){const g=bx(x0,x1,0.88,0.92,0,WH,mat.glass,walls);g.castShadow=false;const n=Math.max(2,Math.round((x1-x0)/1.3));for(let i=0;i<=n;i++){bx(x0+i*(x1-x0)/n-0.025,x0+i*(x1-x0)/n+0.025,0.87,0.93,0,WH,mat.bronze,walls);}}
wall(0,0.9,0.85,0.95);glazing(0.9,4.6);wall(4.6,5.55,0.85,0.95);
glazing(5.75,9.4);wall(9.4,10,0.85,0.95);
// balcony rail + divider
const rail=bx(0,10,0.0,0.03,0,1.0,mat.glass);rail.castShadow=false;bx(0,10,-0.01,0.04,1.0,1.04,mat.bronze);
bx(5.7,5.82,0,0.9,0,1.04,mat.wall);

// ===== living
bx(0.1,0.85,1.55,3.85,0,0.45,mat.oak);bx(0.1,0.12,1.55,3.85,0.05,0.42,mat.oakDark);
const tv=bx(0.3,0.36,2.05,3.35,0.5,1.25,mat.black);
bx(0.32,0.38,2.55,2.85,0.45,0.5,mat.bronze);
let _m=mark();
const rug1=bx(0.9,3.56,1.6,3.92,0,0.015,mat.rugSand);rug1.castShadow=false;
// curved L sofa: back along balcony side (z) and TV-wall side (x), seats facing coffee table
(function(){
  function seg(x,z,ry,len){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;furn.add(g);
    box(len,0.08,0.9,0,0,0,mat.oakDark,g);box(len,0.22,0.9,0,0.08,0,mat.boucle,g);box(len,0.1,0.72,0,0.3,0.08,mat.boucle,g);box(len,0.42,0.2,0,0.3,-0.35,mat.boucle,g);}
  // top run (back toward balcony)
  seg(2.3,1.75,0,1.45);
  // left run (back toward TV wall)
  seg(1.35,3.05,Math.PI/2,1.35);
  // curved corner
  const cx=1.8,cz=2.2,R=0.45;for(let i=0;i<6;i++){const a=Math.PI+(Math.PI/2)*(i+.5)/6;const g=new THREE.Group();g.position.set(cx+Math.cos(a)*R,0,cz+Math.sin(a)*R);g.rotation.y=-a-Math.PI/2;furn.add(g);box(0.26,0.08,0.9,0,0,0.0,mat.oakDark,g);box(0.26,0.22,0.9,0,0.08,0,mat.boucle,g);box(0.26,0.1,0.72,0,0.3,0.08,mat.boucle,g);box(0.3,0.42,0.2,0,0.3,-0.35,mat.boucle,g);}
  sph(0.18,2.6,0.6,1.55,M('#6E7744'),1.3,1,0.5);sph(0.17,1.15,0.6,2.7,M('#B05A36'),0.5,1,1.3);sph(0.16,1.9,0.62,1.75,M('#E4D6C1'),1,1,0.5).rotation.y=0.7;
})();
cyl(0.45,0.32,2.48,0,2.8,mat.trav,null,40);cyl(0.45,0.02,2.48,0.32,2.8,M('#DCCDB4'));
cyl(0.09,0.12,2.48,0.34,2.8,mat.terr,null,16,0.07);sph(0.14,2.48,0.56,2.8,mat.leaf,1,0.8,1);
// TV console on partition, facing living
bx(5.25,5.55,1.0,2.9,0,0.45,mat.oak);bx(5.47,5.53,1.3,2.6,0.6,1.35,mat.black);
// dining (4 chairs)
bx(4.12,4.88,1.65,3.1,0.71,0.76,mat.oak);
[[4.19,1.72],[4.81,1.72],[4.19,3.03],[4.81,3.03]].forEach(p=>cyl(0.03,0.71,p[0],0,p[1],mat.oakDark,null,8));
function chair(x,z,ry){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;furn.add(g);box(0.44,0.06,0.44,0,0.44,0,mat.cushion,g);box(0.44,0.42,0.06,0,0.5,-0.21,mat.cushion,g);[[-.19,-.19],[.19,-.19],[-.19,.19],[.19,.19]].forEach(p=>box(0.04,0.44,0.04,p[0],0,p[1],mat.oakDark,g));}
chair(3.9,1.95,Math.PI/2);chair(3.9,2.75,Math.PI/2);chair(5.0,1.95,-Math.PI/2);chair(5.0,2.75,-Math.PI/2);
moveSince(_m,furnO,wallsO);
bx(4.12,4.88,1.65,3.1,0.71,0.76,mat.oak);[[4.19,1.72],[4.81,1.72],[4.19,3.03],[4.81,3.03]].forEach(p=>cyl(0.03,0.71,p[0],0,p[1],mat.oakDark,null,8));
cyl(0.1,0.1,4.5,0.76,2.35,mat.white,null,16,0.07);sph(0.12,4.5,0.97,2.35,mat.leaf2,1,1.1,1);
const pend=new THREE.Mesh(new THREE.SphereGeometry(0.32,32,16,0,Math.PI*2,0,Math.PI/2),mat.rattan);pend.position.set(4.5,1.75,2.35);pend.material.side=THREE.DoubleSide;furn.add(pend);
const cord=cyl(0.006,0.6,4.5,2.05,2.35,mat.black,furn,6);
// living plants
function potPlant(x,z,s){cyl(0.17*s,0.38*s,x,0,z,mat.terr,null,20,0.21*s);[[0,.75,0,.28],[.12,.62,.08,.2],[-.12,.64,-.06,.2]].forEach(p=>sph(p[3]*s,x+p[0]*s,p[1]*s,z+p[2]*s,mat.leaf,1,1.2,1));}
potPlant(0.45,1.15,1);potPlant(0.42,4.05,0.9);potPlant(0.5,3.6,0.6);
// ===== kitchen: L-run on left wall + back wall, peninsula with 5 stools
bx(0.0,0.75,4.45,6.6,0,0.86,mat.oak);bx(0.0,0.78,4.42,6.6,0.86,0.9,mat.worktop);
bx(0.75,3.5,5.95,6.6,0,0.86,mat.oak);bx(0.75,3.5,5.92,6.6,0.86,0.9,mat.worktop);
bx(0.75,3.68,4.75,5.35,0,0.86,mat.oak);bx(0.72,3.72,4.7,5.38,0.86,0.9,mat.worktop);
bx(0.1,0.65,4.8,5.85,0.9,0.915,mat.black);
[[0.24,5.05],[0.5,5.05],[0.24,5.55],[0.5,5.55]].forEach(p=>cyl(0.08,0.02,p[0],0.915,p[1],M('#3a3a3a'),null,16));
bx(1.7,2.55,6.08,6.48,0.885,0.905,M('#9C978F',{metalness:.6,roughness:.3}));cyl(0.015,0.3,2.12,0.9,6.5,mat.brass,null,8);
_m=mark();bx(3.5,4.2,5.95,6.6,0,0.95,M('#B9B6B1',{metalness:.7,roughness:.35}));moveSince(_m,furnO,wallsO);
[1.08,1.65,2.2,2.74,3.31].forEach(x=>{cyl(0.19,0.05,x,0.68,4.3,mat.cushion);cyl(0.02,0.68,x,0,4.3,mat.bronze,null,8);cyl(0.16,0.02,x,0.3,4.3,mat.bronze,null,16,0.16);});
// ===== entry
const mat2=bx(5.3,6.2,5.65,6.55,0,0.012,mat.rugSand);mat2.castShadow=false;
const door=bx(4.47,4.51,5.8,6.6,0,2.05,mat.oak,walls);
// ===== bedroom
const rug2=bx(6.55,9.2,1.35,3.98,0,0.015,mat.rugCream);rug2.castShadow=false;
bx(7.05,9.75,1.6,3.65,0,0.28,mat.oak);bx(7.1,9.7,1.65,3.6,0.28,0.52,mat.linen);
bx(9.75,9.95,1.55,3.7,0,1.1,M('#D8CBB6'));
bx(7.1,8.4,1.62,3.63,0.52,0.56,mat.olive);bx(8.4,9.1,1.63,3.62,0.52,0.555,M('#E9E1D4'));
sph(0.24,9.4,0.68,2.15,mat.olive,0.6,0.55,1.3);sph(0.24,9.4,0.68,3.05,mat.linen,0.6,0.55,1.3);sph(0.2,9.2,0.66,2.6,mat.olive,0.6,0.55,1.3);
[1.3,3.98].forEach(z=>{cyl(0.22,0.5,9.6,0,z,mat.oakDark);cyl(0.1,0.25,9.6,0.5,z,M('#F3E6CF'),null,20,0.06);});
potPlant(9.35,1.05,0.8);
// TV console on partition, facing bedroom
bx(5.75,6.05,1.0,2.9,0,0.45,mat.oak);bx(5.77,5.83,1.3,2.6,0.6,1.35,mat.black);
// open wardrobe with hanging clothes
_m=mark();

function applyWalls(){walls.traverse(o=>{if(!o.isMesh)return;const u=o.userData;

  if(full||u.y1<=CUT){o.visible=true;o.scale.y=u.sy;o.position.y=u.py;return;}
  if(u.y0>=CUT){o.visible=false;return;}
  const k=(CUT-u.y0)/(u.y1-u.y0);o.visible=true;o.scale.y=u.sy*k;o.position.y=u.y0+(u.py-u.y0)*k;});
