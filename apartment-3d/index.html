<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apartment 3D — To Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#EFE8DD;font-family:Inter,system-ui,sans-serif;color:#2A2520;overflow:hidden}
#c{display:block;width:100vw;height:100vh;touch-action:none}
.bar{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;pointer-events:none}
.bar button{pointer-events:auto;font:500 14px Inter,system-ui,sans-serif;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #CDBFAA;background:#FBF8F3;color:#2A2520;cursor:pointer}
.bar button[aria-pressed="true"]{background:#2A2520;color:#FBF8F3;border-color:#2A2520}
.head{position:absolute;left:20px;right:20px;top:16px;pointer-events:none}
.head h1{margin:0;font-size:18px;font-weight:600}
.head p{margin:4px 0 0;font-size:13px;color:#5E554C}
.labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:600;background:rgba(251,248,243,.92);border:1px solid #DDD1BF;padding:3px 8px;border-radius:10px;white-space:nowrap;text-align:center;line-height:1.3}
.lab.up{background:#2A2520;color:#FBF8F3;border-color:#2A2520;font-size:11px;padding:2px 7px}
.lab small{display:block;font-weight:500;font-size:11px;color:#6A5F54}
body.eve .head h1{color:#F3EEE6}body.eve .head p{color:#CFC6BA}body.eve .bar button[aria-pressed="true"]{background:#E0B44F;color:#2A2520;border-color:#E0B44F}
#joy{position:absolute;left:24px;bottom:84px;width:110px;height:110px;border-radius:50%;background:rgba(251,248,243,.35);border:1px solid rgba(205,191,170,.9);display:none;touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#FBF8F3;border:1px solid #CDBFAA;pointer-events:none}
#hint{position:absolute;left:50%;top:64px;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;font-size:13px;background:rgba(42,37,32,.78);color:#FBF8F3;padding:6px 12px;border-radius:14px;display:none;pointer-events:none}
body.walking #joy,body.walking #hint{display:block}
body.walking .bar button:not(#bWalk):not(#bEve):not(#bB):not(#bA){display:none}
body.walking .labels{display:none}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D model of the apartment"></canvas>
<div class="head"><h1>Your 1-bedroom, to plan</h1><p id="sub">Drag to orbit · pinch or scroll to zoom</p></div>
<div class="labels" id="labels"></div>
<div id="hint">Drag to look around · W A S D or arrow keys, or the joystick, to walk</div>
<div id="joy"><div id="knob"></div></div>
<div class="bar">
  <button id="bWalk" aria-pressed="false">Walk inside</button>
  <button id="bB" aria-pressed="true">Larger unit</button>
  <button id="bA" aria-pressed="false">Smaller unit</button>
  <button id="mPlan" aria-pressed="false">As drawn</button>
  <button id="mImp" aria-pressed="false">Improved</button>
  <button id="mPro" aria-pressed="true">Pro upgrade</button>
  <button id="mStudio" aria-pressed="false">Studio (lounge only)</button>
  <button id="bWalls" aria-pressed="false">Full-height walls</button>
  <button id="bTop" aria-pressed="false">Top view</button>
  <button id="bEve" aria-pressed="false">Evening light</button>
  <button id="bLab" aria-pressed="true">Labels</button>
</div>
<div id="err">The 3D viewer couldn't start in this browser.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){

const canvas=document.getElementById('c');

const scene=new THREE.Scene();
scene.background=new THREE.Color('#EFE8DD');
const camera=new THREE.PerspectiveCamera(40,1,0.1,200);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.49;controls.minDistance=3;controls.maxDistance=30;

function tex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;}
function rnd(a,b){return a+Math.random()*(b-a);}
const oakTex=tex(512,512,(g,w,h)=>{const n=8,pw=w/n;for(let i=0;i<n;i++){let y=-rnd(0,200);while(y<h){const L=rnd(160,300);const l=rnd(-6,6);g.fillStyle=`hsl(30,${38+l}%,${66+l}%)`;g.fillRect(i*pw,y,pw,L);g.strokeStyle='rgba(120,85,50,.12)';for(let k=0;k<6;k++){g.beginPath();const x=i*pw+rnd(4,pw-4);g.moveTo(x,y);g.bezierCurveTo(x+rnd(-4,4),y+L/3,x+rnd(-4,4),y+2*L/3,x,y+L);g.stroke();}g.fillStyle='rgba(90,60,35,.35)';g.fillRect(i*pw,y,pw,2);y+=L;}g.fillStyle='rgba(90,60,35,.3)';g.fillRect(i*pw,0,1.5,h);}},4,4);
const stoneTex=tex(256,256,(g,w,h)=>{for(let i=0;i<4;i++)for(let j=0;j<4;j++){const l=rnd(-3,3);g.fillStyle=`hsl(36,20%,${84+l}%)`;g.fillRect(i*64,j*64,64,64);}g.strokeStyle='#CFC4B4';g.lineWidth=2;for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,h);g.stroke();g.beginPath();g.moveTo(0,i*64);g.lineTo(w,i*64);g.stroke();}},4,1);
const rugTex=(base)=>tex(256,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<5000;i++){g.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'120,95,70'},${rnd(.03,.12)})`;g.fillRect(rnd(0,w),rnd(0,h),2,2);}},3,3);
const zelTex=tex(256,256,(g,w,h)=>{const s=32;for(let i=0;i<8;i++)for(let j=0;j<8;j++){g.fillStyle=`hsl(${rnd(14,20)},${rnd(48,58)}%,${rnd(40,50)}%)`;g.fillRect(i*s+1,j*s+1,s-2,s-2);}},2,2);
const fluteTex=tex(128,16,(g,w,h)=>{for(let i=0;i<8;i++){const x=i*16;const gr=g.createLinearGradient(x,0,x+16,0);gr.addColorStop(0,'#9C744C');gr.addColorStop(.5,'#C9A174');gr.addColorStop(1,'#9C744C');g.fillStyle=gr;g.fillRect(x,0,16,h);}},6,1);
const boucleTex=tex(128,128,(g,w,h)=>{g.fillStyle='#F2ECE2';g.fillRect(0,0,w,h);for(let i=0;i<1400;i++){g.fillStyle=`rgba(190,175,150,${rnd(.15,.35)})`;g.beginPath();g.arc(rnd(0,w),rnd(0,h),rnd(.8,1.8),0,6.3);g.fill();}},2,2);
const limeTex=tex(256,256,(g,w,h)=>{g.fillStyle='#C9A48A';g.fillRect(0,0,w,h);for(let i=0;i<60;i++){g.fillStyle=`rgba(${Math.random()<.5?'235,215,195':'170,125,100'},${rnd(.05,.15)})`;g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(20,70),rnd(10,40),rnd(0,3),0,6.3);g.fill();}},1,1);

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8,metalness:0},o||{}));
const mat={
  wall:M('#EFE7DB',{roughness:.95}),oak:M('#C2945F',{roughness:.6}),oakDark:M('#8E6A47',{roughness:.6}),
  floor:new THREE.MeshStandardMaterial({map:oakTex,roughness:.55}),stone:new THREE.MeshStandardMaterial({map:stoneTex,roughness:.9}),
  trav:M('#E6DAC6',{roughness:.5}),worktop:M('#E9E2D6',{roughness:.35}),terr:M('#B05A36'),zel:new THREE.MeshStandardMaterial({map:zelTex,roughness:.25}),
  boucle:new THREE.MeshStandardMaterial({map:boucleTex,color:'#EDE3D3',roughness:1}),linen:M('#F1EBE1',{roughness:1}),olive:M('#6E7744',{roughness:1}),
  rugSand:new THREE.MeshStandardMaterial({map:rugTex('#DDCDB4'),roughness:1}),rugCream:new THREE.MeshStandardMaterial({map:rugTex('#E9E0D0'),roughness:1}),
  black:M('#1C1A18',{roughness:.4}),bronze:M('#3A332C',{roughness:.5,metalness:.4}),brass:M('#B8955B',{roughness:.35,metalness:.8}),
  white:M('#FAF8F4',{roughness:.3}),glass:new THREE.MeshPhysicalMaterial({color:'#D9E6E8',transparent:true,opacity:.22,roughness:.05,metalness:0}),
  leaf:M('#6F7B4A',{roughness:.9}),leaf2:M('#8C9764',{roughness:.9}),teak:M('#9A6A40',{roughness:.7}),cushion:M('#E8DFD0',{roughness:1}),
  flute:new THREE.MeshStandardMaterial({map:fluteTex,roughness:.6}),lime:new THREE.MeshStandardMaterial({map:limeTex,roughness:1}),
  rattan:M('#C99A5B',{roughness:.9,emissive:'#6b4a1c',emissiveIntensity:0}),steel:M('#B9B6B1',{metalness:.7,roughness:.35}),
  mirror:M('#CFD8DA',{metalness:.9,roughness:.08})
};
mat.rattan.side=THREE.DoubleSide;
mat.glow=M('#FFE7C2',{emissive:'#FFC27A',emissiveIntensity:0,roughness:.5});
mat.curtain=M('#F1EADF',{roughness:1,transparent:true,opacity:.8});mat.curtainB=M('#CDBBA3',{roughness:1});

let G,GW,root=null;
function box(w,h,d,x,y,z,m,g,noShadow){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y+h/2,z);if(!noShadow)b.castShadow=true;b.receiveShadow=true;(g||G).add(b);return b;}
function bx(x0,x1,z0,z1,y0,y1,m,g){return box(x1-x0,y1-y0,z1-z0,(x0+x1)/2,y0,(z0+z1)/2,m,g);}
function cyl(r,h,x,y,z,m,g,seg,rt){const c=new THREE.Mesh(new THREE.CylinderGeometry(rt==null?r:rt,r,h,seg||32),m);c.position.set(x,y+h/2,z);c.castShadow=true;c.receiveShadow=true;(g||G).add(c);return c;}
function sph(r,x,y,z,m,sx,sy,sz,g){const s=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),m);s.position.set(x,y,z);s.scale.set(sx||1,sy||1,sz||1);s.castShadow=true;(g||G).add(s);return s;}
const WH=2.6,OT=0.15,PB=1.1,FT=0.12;
function wall(x0,x1,z0,z1,m){return bx(x0,x1,z0,z1,0,WH,m||mat.wall,GW);}
function glass(x0,x1,z0,z1,y0,y1){const g=bx(x0,x1,z0,z1,y0,y1,mat.glass,GW);g.castShadow=false;return g;}
function door(hx,hz,len,rot,m){const g=new THREE.Group();g.position.set(hx,0,hz);g.rotation.y=rot;GW.add(g);box(len,2.05,0.04,len/2,0,0,m||mat.oak,g);box(0.02,0.04,0.14,len-0.08,1.0,0,mat.brass,g);return g;}
function sofa(x,z,ry,len){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;G.add(g);
  box(len,0.08,0.9,0,0,0,mat.oakDark,g);box(len,0.22,0.9,0,0.08,0,mat.boucle,g);box(len-0.1,0.1,0.72,0,0.3,0.08,mat.boucle,g);box(len,0.42,0.2,0,0.3,-0.35,mat.boucle,g);
  box(0.16,0.32,0.9,-len/2+0.08,0.3,0,mat.boucle,g);box(0.16,0.32,0.9,len/2-0.08,0.3,0,mat.boucle,g);return g;}
function chair(x,z,ry){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;G.add(g);box(0.44,0.06,0.44,0,0.44,0,mat.cushion,g);box(0.44,0.42,0.06,0,0.5,-0.21,mat.cushion,g);[[-.19,-.19],[.19,-.19],[-.19,.19],[.19,.19]].forEach(p=>box(0.04,0.44,0.04,p[0],0,p[1],mat.teak,g));}
function lounger(x,z,ry){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;G.add(g);box(0.7,0.08,0.7,0,0.25,0,mat.teak,g);box(0.62,0.12,0.6,0,0.33,0.02,mat.cushion,g);box(0.7,0.45,0.08,0,0.33,-0.31,mat.teak,g);box(0.6,0.35,0.1,0,0.45,-0.24,mat.cushion,g);[[-.32,-.32],[.32,-.32],[-.32,.32],[.32,.32]].forEach(p=>box(0.05,0.25,0.05,p[0],0,p[1],mat.teak,g));box(0.06,0.3,0.7,-0.35,0.33,0,mat.teak,g);box(0.06,0.3,0.7,0.35,0.33,0,mat.teak,g);}
function potPlant(x,z,s){cyl(0.17*s,0.38*s,x,0,z,mat.terr,null,20,0.21*s);[[0,.75,0,.28],[.12,.62,.08,.2],[-.12,.64,-.06,.2]].forEach(p=>sph(p[3]*s,x+p[0]*s,p[1]*s,z+p[2]*s,mat.leaf,1,1.2,1));}
function olive(x,z,s){s=s||1;cyl(0.28*s,0.55*s,x,0,z,mat.terr,null,24,0.34*s);cyl(0.035*s,1.0*s,x,0.5*s,z,mat.oakDark,null,8);
  [[0,1.75,0,.42],[.22,1.6,.12,.3],[-.2,1.62,-.1,.32],[.05,1.95,-.12,.28],[-.1,1.5,.2,.26]].forEach(p=>sph(p[3]*s,x+p[0]*s,p[1]*s,z+p[2]*s,Math.random()<.5?mat.leaf:mat.leaf2,1,0.8,1));}
function stool(x,z){cyl(0.18,0.05,x,0.72,z,mat.cushion);cyl(0.022,0.72,x,0,z,mat.bronze,null,8);cyl(0.15,0.02,x,0.3,z,mat.bronze,null,16,0.15);}
function wc(x,z){cyl(0.17,0.4,x,0,z,mat.white,null,24);bx(x-0.2,x+0.2,z+0.12,z+0.27,0.2,0.8,mat.white);}

// Sizes read from the floor plan (metres). The plan's depth figures don't add up exactly,
// so each unit is fitted to its drawn overall depth.
const UNITS={
  B:{name:'Larger unit',LW:4.85,BW:3.7,D:5.2,BZ:1.8,KW:3.85,BthW:2.3,bed:1.6},
  A:{name:'Smaller unit',LW:4.45,BW:3.3,D:4.75,BZ:1.75,KW:3.6,BthW:1.95,bed:1.4}
};

// lights (shared)
const hemi=new THREE.HemisphereLight('#FFF6EA','#9C8A70',0.5);scene.add(hemi);
const sun=new THREE.DirectionalLight('#FFE9CC',1.25);scene.add(sun);scene.add(sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=-8;sc.right=8;sc.top=8;sc.bottom=-8;sc.near=1;sc.far=40;sun.shadow.bias=-0.0005;sun.shadow.normalBias=0.02;
const amb=new THREE.AmbientLight('#ffffff',0.15);scene.add(amb);
const pl=new THREE.PointLight('#FFC27A',0,6,2),lampA=new THREE.PointLight('#FFC27A',0,4,2),lampB=new THREE.PointLight('#FFC27A',0,4,2),lampC=new THREE.PointLight('#FFC27A',0,5,2);
const lampK=new THREE.PointLight('#FFC27A',0,4,2),lampL=new THREE.PointLight('#FFC27A',0,4,2),lampE=new THREE.PointLight('#FFC27A',0,4,2);
[pl,lampA,lampB,lampC,lampK,lampL,lampE].forEach(l=>scene.add(l));

let walk=false,yaw=0,pitch=0,ceil=null,entry={x:0,z:0},bounds={},wallBoxes=[];const keys={};let joy={x:0,y:0};
let TARGET=new THREE.Vector3(),cord=null,labs=[],W=0,zB=0;
const f=n=>n.toFixed(2).replace(/0$/,'');


// ===================== STUDIO v3: wet core on the back wall, one clear walking line, big wardrobe + TV wall, L-kitchen =====================
function buildStudio(P){
  if(root){scene.remove(root);root.traverse(o=>{if(o.geometry)o.geometry.dispose();});}
  root=new THREE.Group();scene.add(root);G=new THREE.Group();GW=new THREE.Group();root.add(G,GW);
  const L=P.LW,bw=P.bed,z0=PB+FT,D=P.D-P.BZ,zS=z0+D;W=L;zB=zS;
  const bd=Math.min(1.4,D-bw-0.2),zF=zS-bd,bW=1.7;
  const ed0=bW+0.55,ed1=ed0+0.9,kb0=ed1+0.1,kr=P.LW>4.6?1.2:0.9,zk=zS-0.6-kr,big=P.LW>4.6;
  // ground + balcony
  bx(0,L,z0,zS,-0.05,0,mat.floor).castShadow=false;
  bx(-OT,L+OT,0,PB,-0.08,-0.02,mat.stone).castShadow=false;
  bx(-OT,L+OT,zS+OT,zS+1.5,-0.06,-0.02,M('#E2D9CB')).castShadow=false;
  box(L+1.2,0.1,zS+2.2,L/2,-0.2,zS/2+0.6,M('#DCD2C3'),G,true);
  bx(bW+0.1,kb0-0.05,zS-1.9,zS,0,0.012,mat.stone).castShadow=false; // tiled entry hall
  // shell
  wall(-OT,0,PB,zS+OT);wall(L,L+OT,PB,zS+OT);
  wall(-OT,ed0,zS,zS+OT);wall(ed1,L+OT,zS,zS+OT);
  door(ed0,zS+0.03,0.9,1.3);
  function glazing(x0,x1){glass(x0,x1,PB+0.04,PB+0.08,0,WH);const n=Math.max(2,Math.round((x1-x0)/1.2));for(let i=0;i<=n;i++){const x=x0+i*(x1-x0)/n;bx(x-0.025,x+0.025,PB+0.03,PB+0.09,0,WH,mat.bronze,GW);}}
  wall(-OT,0.4,PB,z0);glazing(0.4,L-0.7);wall(L-0.7,L+OT,PB,z0);
  glass(-OT,L+OT,0,0.03,0,1.0);bx(-OT,L+OT,-0.01,0.04,1.0,1.04,mat.bronze);glass(-OT-0.03,-OT,0,PB,0,1.0);bx(L,L+OT,0,PB,0,1.04,mat.wall);
  lounger(L*0.3,0.55,Math.PI+0.15);lounger(L*0.7,0.55,Math.PI-0.15);cyl(0.28,0.45,L*0.5,0,0.5,mat.teak);sph(0.1,L*0.5,0.55,0.5,mat.leaf);
  olive(0.35,0.5,0.85);olive(L-0.3,0.5,0.8);bx(L*0.5-1.3,L*0.5+1.3,0.12,1.02,-0.02,-0.008,mat.rugSand).castShadow=false;
  // ===== wet core along the back wall: bath | entry | kitchen (one plumbing wall)
  bx(0,bW-0.1,zF,zS,0,0.02,mat.stone).castShadow=false;
  wall(0,bW,zF-0.1,zF);
  wall(bW-0.1,bW,zF-0.1,zF+0.1);wall(bW-0.1,bW,zF+0.8,zS); // 0.7 m opening at the front end of the wall
  bx(bW+0.01,bW+0.05,zF+0.72,zS-0.02,0,2.05,mat.oak,GW);bx(bW,bW+0.07,zF+0.05,zS,2.08,2.12,mat.bronze,GW);bx(bW+0.05,bW+0.08,zF+0.76,zF+0.8,0.9,1.15,mat.brass,GW); // sliding door shown open, no swing
  bx(0,0.85,zF+0.05,zS,0.02,0.05,M('#E7E0D4'));glass(0.85,0.87,zF,zS-0.75,0.05,2.0);
  cyl(0.1,0.02,0.4,2.0,zF+0.6,mat.brass,GW,20);
  bx(0,0.03,zF,zS,0,WH,mat.zel,GW);bx(0,0.85,zS-0.03,zS,0,WH,mat.zel,GW);
  cyl(0.17,0.35,1.2,0.15,zS-0.3,mat.white,null,24);bx(1.0,1.4,zS-0.12,zS,0,1.1,mat.white,GW);bx(1.12,1.28,zS-0.125,zS-0.11,0.85,0.9,mat.brass,GW); // wall-hung toilet, concealed cistern
  bx(0.95,1.45,zF,zF+0.38,0.5,0.82,mat.oak);bx(0.95,1.45,zF,zF+0.38,0.82,0.85,mat.worktop);cyl(0.14,0.08,1.2,0.85,zF+0.2,mat.white,null,24);bx(0.97,1.43,zF,zF+0.02,1.05,1.75,mat.mirror,GW);
  // entry: shoe bench + rug

    bx(xP+0.1,xP+0.5,t0,t1,0,0.45,mat.oak);bx(xP+0.1,xP+0.5,t0,t1,1.85,2.3,mat.oak,GW);bx(xP+0.1,xP+0.13,t0,t1,0.45,1.85,mat.oakDark,GW);
    bx(xP+0.13,xP+0.18,bc-0.5,bc+0.5,0.75,1.35,mat.black);bx(xP+0.14,xP+0.49,t0+0.02,t1-0.02,1.83,1.85,mat.glow,GW);
    // upholstered headboard wall + wall-mounted reading lights
    bx(W-0.05,W-0.03,bc-hw-0.55,bc+hw+0.55,0,1.25,mat.boucle,GW);bx(W-0.05,W-0.02,bc-hw-0.55,bc+hw+0.55,1.25,1.27,mat.oakDark,GW);
    [bc-hw-0.25,bc+hw+0.25].forEach(z=>{bx(W-0.1,W-0.03,z-0.015,z+0.015,1.05,1.12,mat.brass,GW);sph(0.06,W-0.13,1.05,z,mat.glow,1,1,1,GW);});
    // floor-to-ceiling linen curtains: sheer in the lounge, blackout in the bedroom
    const curtain=(x0,x1,m)=>{const n=Math.max(3,Math.round((x1-x0)/0.07));for(let i=0;i<n;i++)cyl(0.045,2.4,x0+0.035+i*(x1-x0-0.07)/(n-1),0.03,z0+0.09,m,GW,8);};
    curtain(0.05,0.45,mat.curtain);curtain(xP-0.5,xP-0.05,mat.curtain);curtain(xP+0.15,xP+0.6,mat.curtainB);curtain(W-0.5,W-0.05,mat.curtainB);
    bx(0,xP,z0+0.03,z0+0.15,2.44,2.48,mat.bronze,GW);bx(xP+0.1,W,z0+0.03,z0+0.15,2.44,2.48,mat.bronze,GW);
    // kitchen under-cabinet light
    bx(0.6,kEnd,zB-0.36,zB-0.33,1.47,1.5,mat.glow,GW);bx(0.33,0.36,kz,zB,1.47,1.5,mat.glow,GW);
    // bathroom: lit mirror, heated towel rail by the door
    bx(xB+0.08,xB+0.53,zB-0.045,zB-0.02,1.02,1.04,mat.glow,GW);
    [0.95,1.15,1.35,1.55].forEach(y=>bx(xB+0.03,xB+0.06,zb+0.95,zb+1.3,y,y+0.025,mat.brass,GW));
    // balcony: outdoor rug under the lounge set
    bx(lc-1.35,lc+1.35,0.12,1.02,-0.02,-0.008,mat.rugSand).castShadow=false;
  }

  // lights
  pl.position.set(px,1.65,pz);lampK.position.set(sx,1.3,zB-0.7);lampL.position.set(0.4,0.95,z0+0.42);lampE.position.set((KW+xB)/2,2.2,zb+0.9);lampA.position.set(W-0.25,0.9,bc-hw-0.25);lampB.position.set(W-0.25,0.9,bc+hw+0.25);lampC.position.set(lc,2.0,0.55);
  sun.position.set(W/2-3,12,-6);sun.target.position.set(W/2,0,zB/2);
  TARGET.set(W/2,0,zB/2);

  const r=v=>f(v)+' × ';
  const cut=imp?0.55:0;
  labs=[['Lounge',r(P.LW)+f(zb-cut-z0)+' m',imp?1.75:1.9,imp?lz+1.0:z0+1.2],[imp?'Dining':'Dining bar','',dz[0],dz[1]],['Kitchen',r(KW)+f(P.BZ+cut)+' m',1.9,imp?zb+0.65:zb+0.95],['Lobby',r(xB-0.1-KW-0.1)+f(P.BZ)+' m',(KW+xB)/2,zb+0.6],
    ['Bedroom',r(P.BW)+f(zb-z0)+' m',(xP+W)/2+0.4,bc],['Bath',r(P.BthW)+f(P.BZ-0.1)+' m',(xB+W)/2,zb+0.6],['Balcony',r(W+2*OT)+f(PB)+' m',lc+1.25,0.55]];
  if(pro)[['Media wall',xP-0.45,lz-0.9],['Storage wall',xP+0.45,zb-1.3],['Coat cupboard',xB-0.3,zB-0.35],['Headboard wall',W-0.3,bc-hw-0.55]].forEach(t=>labs.push([t[0],'',t[1],t[2],'up']));
  const lbox=document.getElementById('labels');lbox.innerHTML='';
  labs=labs.map(l=>{const d=document.createElement('div');d.className=l[4]?'lab '+l[4]:'lab';d.textContent=l[0];if(l[1]){const s=document.createElement('small');s.textContent=l[1];d.appendChild(s);}lbox.appendChild(d);return {d,v:new THREE.Vector3(l[2],1.25,l[3])};});
  document.getElementById('sub').textContent=`${P.name} · ${{plan:'as drawn',imp:'improved',pro:'pro upgrade'}[mode]} · ${f(W)} × ${f(P.D)} m inside · drag to orbit, pinch or scroll to zoom`;
  const ce=new THREE.Mesh(new THREE.PlaneGeometry(W,zB-z0),M('#F4EFE7',{roughness:1,side:THREE.DoubleSide}));ce.rotation.x=Math.PI/2;ce.position.set(W/2,WH,(z0+zB)/2);ce.visible=walk;root.add(ce);ceil=ce;
  entry={x:dx0+0.45,z:zB-0.5};bounds={x0:0.2,x1:W-0.2,z0:0.25,z1:zB-0.2};
  wallBoxes=GW.children.filter(m=>m.isMesh&&m.geometry.type==='BoxGeometry'&&m.geometry.parameters.height>=1&&m.material!==mat.glass).map(m=>{const q=m.geometry.parameters;return [m.position.x-q.width/2,m.position.x+q.width/2,m.position.z-q.depth/2,m.position.z+q.depth/2];});
  applyWalls();applyLight();
}

let top=false;
function view3d(){const k=Math.max(0.65,W/8.65);camera.position.set(TARGET.x,11.5*k,zB+7.5*k);controls.target.copy(TARGET);controls.update();}
function viewTop(){const k=Math.max(0.65,W/8.65);camera.position.set(TARGET.x,14*k,TARGET.z+0.01);controls.target.copy(TARGET);controls.update();}
let full=false;const CUT=1.2;
function applyWalls(){const on=full||walk;GW.traverse(o=>{if(!o.isMesh)return;const u=o.userData;
  if(u.y0===undefined){o.geometry.computeBoundingBox();const bb=o.geometry.boundingBox;u.y0=o.position.y+bb.min.y*o.scale.y;u.y1=o.position.y+bb.max.y*o.scale.y;u.py=o.position.y;u.sy=o.scale.y;}
  if(on||u.y1<=CUT){o.visible=true;o.scale.y=u.sy;o.position.y=u.py;return;}
  if(u.y0>=CUT){o.visible=false;return;}
  const k=(CUT-u.y0)/(u.y1-u.y0);o.visible=true;o.scale.y=u.sy*k;o.position.y=u.y0+(u.py-u.y0)*k;});
  if(cord)cord.visible=on;}
let showLab=true;
function placeLabels(){const w=canvas.clientWidth,h=canvas.clientHeight;labs.forEach(o=>{const p=o.v.clone().project(camera);o.d.style.display=(showLab&&p.z<1)?'block':'none';o.d.style.left=((p.x+1)/2*w)+'px';o.d.style.top=((1-p.y)/2*h)+'px';});}
function setBtn(id,on){document.getElementById(id).setAttribute('aria-pressed',on?'true':'false');}
let mode=location.hash.indexOf('plan')>=0?'plan':location.hash.indexOf('imp')>=0?'imp':'pro',unit='B';
function applyLight(){[pl,lampA,lampB,lampC].forEach(l=>l.intensity=eve?2.2:0);[lampK,lampL,lampE].forEach(l=>l.intensity=eve&&(mode==='pro'||mode==='studio')?1.4:0);mat.rattan.emissiveIntensity=eve?0.9:0;mat.glow.emissiveIntensity=eve?2.0:0;}
function setUnit(k){unit=k;build(UNITS[k]);setBtn('bB',k==='B');setBtn('bA',k==='A');['plan','imp','pro','studio'].forEach(m=>setBtn('m'+m[0].toUpperCase()+m.slice(1),mode===m));if(walk)spawn();else top?viewTop():view3d();}
['plan','imp','pro','studio'].forEach(m=>document.getElementById('m'+m[0].toUpperCase()+m.slice(1)).onclick=()=>{mode=m;setUnit(unit);});
document.getElementById('bB').onclick=()=>setUnit('B');
document.getElementById('bA').onclick=()=>setUnit('A');
document.getElementById('bWalls').onclick=()=>{full=!full;applyWalls();setBtn('bWalls',full);};
document.getElementById('bTop').onclick=()=>{top=!top;top?viewTop():view3d();setBtn('bTop',top);};
let eve=false;document.getElementById('bEve').onclick=()=>{eve=!eve;setBtn('bEve',eve);
  sun.intensity=eve?0.25:1.25;sun.color.set(eve?'#9DB0D0':'#FFE9CC');hemi.intensity=eve?0.22:0.5;amb.intensity=eve?0.05:0.15;
  applyLight();scene.background.set(eve?'#2B2A31':'#EFE8DD');
  document.body.classList.toggle('eve',eve);};
document.getElementById('bLab').onclick=()=>{showLab=!showLab;setBtn('bLab',showLab);};
setUnit(location.hash.indexOf('A')>=0?'A':'B');

function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=walk?(w<h?80:68):(w<h?58:40);camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
// ===== walk-through mode
function spawn(){yaw=0;pitch=-0.05;camera.position.set(entry.x,1.6,entry.z);}
function setWalk(on){walk=on;document.body.classList.toggle('walking',on);setBtn('bWalk',on);document.getElementById('bWalk').textContent=on?'Exit walk':'Walk inside';
  controls.enabled=!on;if(ceil)ceil.visible=on;applyWalls();resize();if(on)spawn();else top?viewTop():view3d();}
document.getElementById('bWalk').onclick=()=>setWalk(!walk);
const hit=(x,z)=>{const r=0.22;return wallBoxes.some(b=>x>b[0]-r&&x<b[1]+r&&z>b[2]-r&&z<b[3]+r);};
let drag=null;
canvas.addEventListener('pointerdown',e=>{if(!walk)return;drag={x:e.clientX,y:e.clientY,id:e.pointerId};try{canvas.setPointerCapture(e.pointerId);}catch(_){}});
canvas.addEventListener('pointermove',e=>{if(!walk||!drag||e.pointerId!==drag.id)return;yaw-=(e.clientX-drag.x)*0.005;pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-drag.y)*0.005));drag.x=e.clientX;drag.y=e.clientY;});
['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t,()=>drag=null));
const joyEl=document.getElementById('joy'),knob=document.getElementById('knob');let jid=null;
function joyMove(e){const r=joyEl.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}joy={x,y};knob.style.transform=`translate(${x*35}px,${y*35}px)`;}
joyEl.addEventListener('pointerdown',e=>{jid=e.pointerId;try{joyEl.setPointerCapture(jid);}catch(_){}joyMove(e);e.stopPropagation();});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyMove(e);});
const joyEnd=()=>{jid=null;joy={x:0,y:0};knob.style.transform='';};joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
window.addEventListener('keydown',e=>{keys[e.code]=true;if(walk&&/^Arrow/.test(e.code))e.preventDefault();if(walk&&e.code==='Escape')setWalk(false);});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
let last=performance.now();
(function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min(0.05,(now-last)/1000);last=now;
  if(walk){
    const K=c=>keys[c]?1:0;
    let f=K('KeyW')+K('ArrowUp')-K('KeyS')-K('ArrowDown')-joy.y,s=K('KeyD')-K('KeyA')+joy.x;
    yaw-=(K('ArrowRight')-K('ArrowLeft'))*1.8*dt;
    const l=Math.hypot(f,s);if(l>1){f/=l;s/=l;}
    const sp=1.5*dt,dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp,P=camera.position;
    if(!hit(P.x+dx,P.z))P.x=Math.max(bounds.x0,Math.min(bounds.x1,P.x+dx));
    if(!hit(P.x,P.z+dz))P.z=Math.max(bounds.z0,Math.min(bounds.z1,P.z+dz));
    camera.rotation.set(pitch,yaw,0,'YXZ');
  }else controls.update();
  renderer.render(scene,camera);if(!walk)placeLabels();})();
})();
</script>
